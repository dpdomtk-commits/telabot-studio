name: Process Downsells Cron

on:
  schedule:
    # Executa a cada 5 minutos gratuitamente pelo GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-downsells:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Worker de Downsells
        run: |
          curl -s -X GET "https://telabot-studio.vercel.app/api/public/webhooks/syncpay" \
            -H "Content-Type: application/json" || true
